[workspace]
channels = ["conda-forge"]
name = "Plotly-Dash-Workshop-Demo"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
app = "python demo/app.py"
notebook = "jupyter lab archived/01_plotly_intro.ipynb"
generic_app = "python archived/generic_app.py"

[dependencies]
plotly = ">=7.0.0,<8"
pandas = ">=3.0.5,<4"
jupyterlab = ">=4.6.3,<5"
nbformat = ">=5.11.1,<6"
nbconvert = ">=7.17.1,<8"
dash = ">=4.4.1,<5"
dash-bootstrap-components = ">=2.0.4,<3"
